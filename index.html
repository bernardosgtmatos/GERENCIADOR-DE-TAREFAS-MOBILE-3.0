<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Organizador Diário - Tarefas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        /* Container principal */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        /* HUD Principal */
        .hud-main {
            background: white;
            padding: 24px 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .task-input {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .task-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .alarm-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .alarm-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .alarm-time {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            font-size: 14px;
            background: white;
            display: none;
        }

        .alarm-time.active {
            display: block;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-add:active {
            transform: scale(0.98);
        }

        /* Abas de navegação */
        .tabs {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .tab.active {
            color: #667eea;
            background: white;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        /* Lista de tarefas */
        .tasks-container {
            padding: 20px;
            max-height: 450px;
            overflow-y: auto;
        }

        .task-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .task-check {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
            word-break: break-word;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .task-date {
            font-size: 12px;
            color: #64748b;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .alarm-badge {
            background: #fee2e2;
            color: #dc2626;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-delete {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #cbd5e1;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .btn-delete:active {
            color: #ef4444;
        }

        /* Botões de ação */
        .action-buttons {
            display: flex;
            gap: 12px;
            padding: 20px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }

        .btn-action {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-finish {
            background: #10b981;
            color: white;
        }

        .btn-history {
            background: #3b82f6;
            color: white;
        }

        .btn-finish:active, .btn-history:active {
            transform: scale(0.98);
        }

        /* Modal de relatório */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 32px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1e293b;
        }

        .report-section {
            margin-bottom: 20px;
        }

        .report-section h4 {
            color: #475569;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .report-item {
            padding: 8px;
            border-left: 3px solid;
            margin-bottom: 8px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .report-item.completed {
            border-left-color: #10b981;
        }

        .report-item.pending {
            border-left-color: #ef4444;
        }

        .close-modal {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 24px;
            width: 100%;
            font-weight: 600;
            margin-top: 16px;
            cursor: pointer;
        }

        /* Histórico por abas de dias */
        .history-days {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .day-card {
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .day-header {
            background: #f8fafc;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 16px;
            color: #1e293b;
            border-bottom: 1px solid #e2e8f0;
        }

        .history-task {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .task-date {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- HUD Principal -->
    <div class="hud-main">
        <div class="title">✅ Minhas Tarefas</div>
        <div class="input-group">
            <input type="text" id="taskInput" class="task-input" placeholder="Digite sua tarefa... 📝" autocomplete="off">
            <div class="alarm-group">
                <label class="alarm-checkbox">
                    <input type="checkbox" id="alarmCheckbox"> 
                    <span>⏰ Alarmar</span>
                </label>
                <input type="time" id="alarmTime" class="alarm-time">
            </div>
            <button id="addTaskBtn" class="btn-add">+ Adicionar Tarefa</button>
        </div>
    </div>

    <!-- Abas -->
    <div class="tabs">
        <button class="tab active" data-tab="today">📅 Hoje</button>
        <button class="tab" data-tab="history">📜 Histórico</button>
    </div>

    <!-- Conteúdo Hoje -->
    <div id="todayPanel" class="tasks-container">
        <div id="todayTasksList"></div>
    </div>

    <!-- Conteúdo Histórico -->
    <div id="historyPanel" style="display: none;" class="tasks-container">
        <div id="historyList"></div>
    </div>

    <!-- Botões de ação -->
    <div class="action-buttons">
        <button id="finishDayBtn" class="btn-action btn-finish">🏁 Finalizar Dia</button>
        <button id="refreshHistoryBtn" class="btn-action btn-history">🔄 Atualizar Histórico</button>
    </div>
</div>

<!-- Modal Relatório -->
<div id="reportModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">📊 Relatório do Dia</div>
        <div id="reportContent"></div>
        <button class="close-modal" onclick="closeReportModal()">Fechar</button>
    </div>
</div>

<script>
    // ========== INÍCIO DAS ALTERAÇÕES PARA ALARME ==========
    // Plugin de notificações nativas (disponível no Capacitor)
    let LocalNotifications;
    
    // Verificar se está rodando no Capacitor (app nativo) ou navegador
    const isNative = typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform();
    
    // Função para agendar notificação nativa
    async function scheduleNativeNotification(task) {
        if (!isNative) {
            // Fallback para teste no navegador
            console.log('[Teste] Alarme para:', task.text, 'às', task.alarmTime);
            return;
        }
        
        try {
            const [hour, minute] = task.alarmTime.split(':');
            const alarmDate = new Date();
            alarmDate.setHours(parseInt(hour), parseInt(minute), 0, 0);
            
            // Se o horário já passou hoje, agenda para amanhã
            if (alarmDate < new Date()) {
                alarmDate.setDate(alarmDate.getDate() + 1);
            }
            
            await LocalNotifications.schedule({
                notifications: [
                    {
                        title: '⏰ Organizador Diário',
                        body: task.text,
                        id: task.id,
                        schedule: { at: alarmDate },
                        sound: null,
                        attachments: null,
                        actionTypeId: '',
                        extra: { taskId: task.id }
                    }
                ]
            });
            console.log('Notificação agendada para:', alarmDate);
        } catch (error) {
            console.error('Erro ao agendar notificação:', error);
        }
    }
    
    // Função para cancelar notificação (usar quando tarefa for concluída ou deletada)
    async function cancelNativeNotification(taskId) {
        if (!isNative) return;
        
        try {
            await LocalNotifications.cancel({ notifications: [{ id: taskId }] });
            console.log('Notificação cancelada para tarefa:', taskId);
        } catch (error) {
            console.error('Erro ao cancelar notificação:', error);
        }
    }
    
    // Função para solicitar permissão de notificações
    async function requestNotificationPermission() {
        if (!isNative) return true;
        
        try {
            const permission = await LocalNotifications.requestPermissions();
            return permission.display === 'granted';
        } catch (error) {
            console.error('Erro ao solicitar permissão:', error);
            return false;
        }
    }
    
    // Nova função checkAlarm usando notificações nativas (substitui a original)
    async function checkAlarm(task) {
        if (task.hasAlarm && task.alarmTime && !task.completed && !task.alarmTriggered) {
            if (isNative) {
                await scheduleNativeNotification(task);
                task.alarmTriggered = true;
                saveData();
            } else {
                // Fallback com alert para testes no navegador
                const now = new Date();
                const [alarmHour, alarmMinute] = task.alarmTime.split(':');
                const alarmDate = new Date();
                alarmDate.setHours(parseInt(alarmHour), parseInt(alarmMinute), 0, 0);
                
                const diff = alarmDate - now;
                if (diff > 0 && diff <= 60000) {
                    setTimeout(() => {
                        if(!task.completed && !task.alarmTriggered) {
                            task.alarmTriggered = true;
                            alert(`⏰ ALARME! Tarefa: ${task.text}\nHorário: ${task.alarmTime}`);
                            saveData();
                        }
                    }, diff);
                }
            }
        }
    }
    
    // Inicializar plugin e solicitar permissão ao carregar o app
    async function initAlarms() {
        if (isNative) {
            // Importar o plugin do Capacitor
            const { LocalNotifications: LocalNotificationsPlugin } = Capacitor.Plugins;
            LocalNotifications = LocalNotificationsPlugin;
            
            // Solicitar permissão
            const hasPermission = await requestNotificationPermission();
            if (hasPermission) {
                console.log('Permissão de notificação concedida');
            } else {
                console.log('Permissão de notificação negada');
            }
        }
    }
    // ========== FIM DAS ALTERAÇÕES PARA ALARME ==========

    // Estrutura de dados
    let tasks = []; // Tarefas do dia atual
    let historyTasks = {}; // Objeto com chave YYYY-MM-DD e array de tarefas
    let currentDate = new Date().toISOString().split('T')[0];

    // Carregar dados do localStorage
    function loadData() {
        const savedTasks = localStorage.getItem('currentTasks');
        if(savedTasks) {
            tasks = JSON.parse(savedTasks);
            // Recriar notificações para tarefas existentes que têm alarme e não foram concluídas
            if (isNative) {
                tasks.forEach(task => {
                    if (task.hasAlarm && task.alarmTime && !task.completed && !task.alarmTriggered) {
                        scheduleNativeNotification(task);
                        task.alarmTriggered = true;
                    }
                });
                saveData();
            }
        }
        
        const savedHistory = localStorage.getItem('tasksHistory');
        if(savedHistory) {
            historyTasks = JSON.parse(savedHistory);
        }
        
        renderTodayTasks();
    }

    // Salvar dados
    function saveData() {
        localStorage.setItem('currentTasks', JSON.stringify(tasks));
        localStorage.setItem('tasksHistory', JSON.stringify(historyTasks));
    }

    // Formatar data e hora
    function getCurrentDateTime() {
        const now = new Date();
        const date = now.toLocaleDateString('pt-BR');
        const time = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        return `${date} às ${time}`;
    }

    // Adicionar tarefa
    async function addTask() {
        const taskInput = document.getElementById('taskInput');
        const text = taskInput.value.trim();
        
        if(text === '') {
            alert('Por favor, digite uma tarefa!');
            return;
        }
        
        const hasAlarm = document.getElementById('alarmCheckbox').checked;
        let alarmTime = null;
        
        if(hasAlarm) {
            alarmTime = document.getElementById('alarmTime').value;
            if(!alarmTime) {
                alert('Por favor, selecione um horário para o alarme!');
                return;
            }
        }
        
        const newTask = {
            id: Date.now(),
            text: text,
            completed: false,
            createdAt: getCurrentDateTime(),
            createdTimestamp: new Date().getTime(),
            hasAlarm: hasAlarm,
            alarmTime: alarmTime,
            alarmTriggered: false
        };
        
        tasks.unshift(newTask);
        taskInput.value = '';
        document.getElementById('alarmCheckbox').checked = false;
        document.getElementById('alarmTime').value = '';
        document.getElementById('alarmTime').classList.remove('active');
        
        saveData();
        renderTodayTasks();
        
        // Verificar alarme imediatamente
        if(hasAlarm && alarmTime) {
            await checkAlarm(newTask);
        }
    }

    // Alternar conclusão da tarefa
    async function toggleTask(id) {
        const task = tasks.find(t => t.id === id);
        if(task) {
            task.completed = !task.completed;
            
            // Se a tarefa foi concluída, cancelar a notificação
            if (task.completed && isNative && task.hasAlarm && task.alarmTriggered) {
                await cancelNativeNotification(task.id);
            }
            
            saveData();
            renderTodayTasks();
        }
    }

    // Deletar tarefa
    async function deleteTask(id) {
        const task = tasks.find(t => t.id === id);
        
        // Cancelar notificação se existir
        if (task && task.hasAlarm && task.alarmTriggered && isNative) {
            await cancelNativeNotification(task.id);
        }
        
        tasks = tasks.filter(t => t.id !== id);
        saveData();
        renderTodayTasks();
    }

    // Finalizar dia e gerar relatório
    function finishDay() {
        const completedTasks = tasks.filter(t => t.completed);
        const pendingTasks = tasks.filter(t => !t.completed);
        
        // Salvar no histórico
        const todayKey = currentDate;
        if(!historyTasks[todayKey]) {
            historyTasks[todayKey] = [];
        }
        
        // Copiar tarefas atuais para o histórico
        const tasksToSave = tasks.map(t => ({
            ...t,
            archivedDate: getCurrentDateTime()
        }));
        
        historyTasks[todayKey] = tasksToSave;
        
        // Gerar relatório
        const reportHTML = `
            <div class="report-section">
                <h4>✅ Tarefas Cumpridas (${completedTasks.length})</h4>
                ${completedTasks.length === 0 ? '<p>Nenhuma tarefa cumprida hoje</p>' : 
                    completedTasks.map(t => `<div class="report-item completed">📌 ${escapeHtml(t.text)}<br><small>${t.createdAt}</small></div>`).join('')}
            </div>
            <div class="report-section">
                <h4>❌ Tarefas Não Cumpridas (${pendingTasks.length})</h4>
                ${pendingTasks.length === 0 ? '<p>Parabéns! Todas as tarefas foram cumpridas! 🎉</p>' : 
                    pendingTasks.map(t => `<div class="report-item pending">⚠️ ${escapeHtml(t.text)}<br><small>${t.createdAt}</small>${t.hasAlarm ? `<br>⏰ Alarme: ${t.alarmTime}` : ''}</div>`).join('')}
            </div>
            <div class="report-section">
                <h4>📈 Resumo</h4>
                <p>Total de tarefas: ${tasks.length}</p>
                <p>Taxa de conclusão: ${tasks.length === 0 ? 0 : Math.round((completedTasks.length/tasks.length)*100)}%</p>
            </div>
        `;
        
        document.getElementById('reportContent').innerHTML = reportHTML;
        document.getElementById('reportModal').classList.add('active');
        
        // Cancelar notificações pendentes antes de limpar tarefas
        if (isNative) {
            tasks.forEach(async task => {
                if (task.hasAlarm && task.alarmTriggered) {
                    await cancelNativeNotification(task.id);
                }
            });
        }
        
        // Limpar tarefas atuais
        tasks = [];
        saveData();
        renderTodayTasks();
    }

    // Renderizar tarefas de hoje
    function renderTodayTasks() {
        const container = document.getElementById('todayTasksList');
        
        if(tasks.length === 0) {
            container.innerHTML = '<div class="empty-state">✨ Nenhuma tarefa para hoje! Adicione uma acima ✨</div>';
            return;
        }
        
        container.innerHTML = tasks.map(task => `
            <div class="task-item">
                <div class="task-header">
                    <input type="checkbox" class="task-check" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                    <div class="task-text ${task.completed ? 'completed' : ''}">${escapeHtml(task.text)}</div>
                    <button class="btn-delete" onclick="deleteTask(${task.id})">🗑️</button>
                </div>
                <div class="task-date">
                    <span>📅 ${task.createdAt}</span>
                    ${task.hasAlarm ? `<span class="alarm-badge">⏰ Alarme às ${task.alarmTime}</span>` : ''}
                </div>
            </div>
        `).join('');
    }

    // Renderizar histórico por dias
    function renderHistory() {
        const container = document.getElementById('historyList');
        const days = Object.keys(historyTasks).sort().reverse();
        
        if(days.length === 0) {
            container.innerHTML = '<div class="empty-state">📭 Nenhum histórico disponível. Finalize um dia para ver aqui!</div>';
            return;
        }
        
        container.innerHTML = '<div class="history-days">' + days.map(day => {
            const dayTasks = historyTasks[day];
            const completedCount = dayTasks.filter(t => t.completed).length;
            const totalCount = dayTasks.length;
            
            return `
                <div class="day-card">
                    <div class="day-header">
                        📆 ${formatDateLabel(day)} - ${completedCount}/${totalCount} concluídas
                    </div>
                    ${dayTasks.map(task => `
                        <div class="history-task">
                            <div style="flex:1">
                                <div style="${task.completed ? 'text-decoration: line-through; color: #94a3b8;' : 'font-weight: 500;'}">
                                    ${escapeHtml(task.text)}
                                </div>
                                <small style="color: #64748b;">Criado: ${task.createdAt}</small>
                                ${task.completed ? '<br><small style="color: #10b981;">✓ Concluída</small>' : '<br><small style="color: #ef4444;">✗ Pendente</small>'}
                                ${task.hasAlarm ? `<br><small>⏰ Alarme: ${task.alarmTime}</small>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }).join('') + '</div>';
    }

    // Formatar data label
    function formatDateLabel(dateStr) {
        const [year, month, day] = dateStr.split('-');
        return `${day}/${month}/${year}`;
    }

    // Escapar HTML
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Alternar abas
    function switchTab(tabId) {
        const todayPanel = document.getElementById('todayPanel');
        const historyPanel = document.getElementById('historyPanel');
        const tabs = document.querySelectorAll('.tab');
        
        tabs.forEach(tab => tab.classList.remove('active'));
        
        if(tabId === 'today') {
            todayPanel.style.display = 'block';
            historyPanel.style.display = 'none';
            document.querySelector('.tab[data-tab="today"]').classList.add('active');
            renderTodayTasks();
        } else {
            todayPanel.style.display = 'none';
            historyPanel.style.display = 'block';
            document.querySelector('.tab[data-tab="history"]').classList.add('active');
            renderHistory();
        }
    }

    // Fechar modal
    function closeReportModal() {
        document.getElementById('reportModal').classList.remove('active');
    }

    // Configurar verificação periódica (apenas para fallback no navegador)
    function startAlarmChecker() {
        setInterval(() => {
            tasks.forEach(task => {
                if(task.hasAlarm && !task.completed && !task.alarmTriggered) {
                    checkAlarm(task);
                }
            });
        }, 30000);
    }

    // Eventos e inicialização
    document.getElementById('addTaskBtn').addEventListener('click', addTask);
    document.getElementById('taskInput').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') addTask();
    });
    document.getElementById('finishDayBtn').addEventListener('click', finishDay);
    document.getElementById('refreshHistoryBtn').addEventListener('click', () => {
        if(document.querySelector('.tab[data-tab="history"]').classList.contains('active')) {
            renderHistory();
        }
    });
    
    document.getElementById('alarmCheckbox').addEventListener('change', (e) => {
        const alarmTimeInput = document.getElementById('alarmTime');
        if(e.target.checked) {
            alarmTimeInput.classList.add('active');
        } else {
            alarmTimeInput.classList.remove('active');
            alarmTimeInput.value = '';
        }
    });
    
    // Eventos das abas
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            switchTab(tab.dataset.tab);
        });
    });
    
    // Inicialização assíncrona
    (async function() {
        await initAlarms();      // <-- NOVO: inicializa sistema de alarmes
        loadData();
        startAlarmChecker();
    })();
    
    // Fechar modal ao clicar fora
    window.onclick = function(event) {
        const modal = document.getElementById('reportModal');
        if(event.target === modal) {
            closeReportModal();
        }
    }
</script>
</body>
</html>
